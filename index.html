<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hierholzer paso a paso</title>
<style>
  :root {
    --fondo: #0f1830; --panel: #1b2848; --borde: #2e4272;
    --cian: #00d9ff; --naranja: #e07b39; --texto: #ffffff; --suave: #a9b8d4; --tenue: #6d7fa3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 30% 20%, #1e2d55 0%, var(--fondo) 70%);
    color: var(--texto); font-family: "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; border-bottom: 1px solid var(--borde); gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header h1 span { color: var(--cian); }
  .tabs { display: flex; gap: 8px; }
  .tab {
    background: transparent; color: var(--suave); border: 1px solid var(--borde);
    padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .tab.activa { background: var(--cian); color: #0b1430; border-color: var(--cian); font-weight: 700; }
  main { flex: 1; display: flex; min-height: 0; }
  #lienzo-caja { flex: 1; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #leyenda-calle {
    position: absolute; left: 24px; bottom: 20px; right: 24px; pointer-events: none;
    font-size: 22px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.8);
  }
  #leyenda-calle small { display: block; font-size: 14px; font-weight: 400; color: var(--suave); margin-bottom: 2px; }
  aside {
    width: 380px; flex-shrink: 0; background: rgba(22,34,63,.85); border-left: 1px solid var(--borde);
    display: flex; flex-direction: column; padding: 18px 20px; gap: 14px; overflow-y: auto;
  }
  .fases { display: flex; flex-direction: column; gap: 4px; }
  .fase {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
    color: var(--tenue); cursor: pointer; font-size: 14px; border: 1px solid transparent;
  }
  .fase b {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--tenue); font-size: 12px; flex-shrink: 0;
  }
  .fase.hecha { color: var(--suave); }
  .fase.hecha b { border-color: var(--cian); color: var(--cian); }
  .fase.actual { color: var(--texto); background: var(--panel); border-color: var(--borde); font-weight: 600; }
  .fase.actual b { background: var(--cian); color: #0b1430; border-color: var(--cian); }
  #titulo-fase { font-size: 22px; font-weight: 700; color: var(--cian); }
  #texto-fase { font-size: 15.5px; line-height: 1.5; color: #dde5f3; }
  #texto-fase .conclusion { display: block; margin-top: 8px; color: var(--naranja); font-weight: 700; }
  .datos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dato { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; }
  .dato .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dato .e { font-size: 12px; color: var(--suave); margin-top: 2px; }
  .dato.naranja .v { color: var(--naranja); }
  .dato.cian .v { color: var(--cian); }
  #lista-pasos { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
  #lista-pasos div { padding: 6px 8px; border-radius: 6px; border-left: 4px solid; background: rgba(27,40,72,.6); color: var(--suave); }
  #lista-pasos div.actual { color: var(--texto); background: var(--panel); }
  .controles { display: flex; gap: 8px; align-items: center; margin-top: auto; flex-wrap: wrap; }
  .controles button {
    background: var(--panel); color: var(--texto); border: 1px solid var(--borde); border-radius: 8px;
    padding: 8px 12px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .controles button:hover { border-color: var(--cian); }
  .controles label { font-size: 12px; color: var(--suave); display: flex; align-items: center; gap: 6px; }
  .ayuda { font-size: 11.5px; color: var(--tenue); }
  sub { font-size: 70%; }
</style>
</head>
<body>
<header>
  <h1>Recorridos de Euler · <span>algoritmo de Hierholzer</span></h1>
  <div class="tabs">
    <button class="tab" data-caso="ejemplo">Ejemplo del informe</button>
    <button class="tab" data-caso="barrio">Barrio de la UAI</button>
  </div>
</header>
<main>
  <div id="lienzo-caja">
    <canvas id="lienzo"></canvas>
    <div id="leyenda-calle"></div>
  </div>
  <aside>
    <div class="fases" id="fases"></div>
    <div id="titulo-fase"></div>
    <div id="texto-fase"></div>
    <div class="datos" id="datos"></div>
    <div id="lista-pasos"></div>
    <div class="controles">
      <button id="btn-ant">◀ Fase</button>
      <button id="btn-pausa">Pausa</button>
      <button id="btn-sig">Fase ▶</button>
      <label>Velocidad <input id="vel" type="range" min="0.25" max="4" step="0.25" value="1"></label>
    </div>
    <div class="ayuda">Flechas o control de diapositivas: cambiar de fase · Espacio: pausa · R: repetir · 1 y 2: cambiar de caso</div>
  </aside>
</main>

  const a = D.arcos[i];
  let [x1, y1] = P(a.u), [x2, y2] = P(a.v);
  const dx = x2 - x1, dy = y2 - y1, n = Math.hypot(dx, dy) || 1;
  const c = corr ?? (esDoble(a) ? grosor * 0.9 : 0);      // las dos manos de una calle, una a cada lado
  x1 += -dy / n * c; y1 += dx / n * c; x2 += -dy / n * c; y2 += dx / n * c;
  const recorte = caso === "ejemplo" ? radio + 4 : 0;
  return [x1 + dx / n * recorte, y1 + dy / n * recorte, x2 - dx / n * recorte, y2 - dy / n * recorte];
}

function linea(i, color, ancho, opts = {}) {
  const [x1, y1, x2, y2] = puntos(i, opts.corr);
  const f = opts.hasta ?? 1;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.lineCap = "round";
  if (opts.punteada) ctx.setLineDash([ancho * 2, ancho * 1.6]);
  if (opts.brillo) { ctx.shadowColor = color; ctx.shadowBlur = opts.brillo; }
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + (x2 - x1) * f, y1 + (y2 - y1) * f); ctx.stroke();
  ctx.restore();
  if (opts.flecha && f > 0.55) flecha(x1, y1, x2, y2, color, 0.55);
}

function flecha(x1, y1, x2, y2, color, en) {
  const x = x1 + (x2 - x1) * en, y = y1 + (y2 - y1) * en, ang = Math.atan2(y2 - y1, x2 - x1);
  const s = caso === "ejemplo" ? 16 : 7;
  ctx.save(); ctx.fillStyle = color; ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, s * 0.65); ctx.lineTo(-s * 0.7, -s * 0.65); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function vertice(v, color, r, texto, colorTexto = "#fff") {
  const [x, y] = P(v);
  ctx.save();
  ctx.fillStyle = caso === "ejemplo" ? "#0e1733" : color; ctx.strokeStyle = color;
  ctx.lineWidth = caso === "ejemplo" ? 5 : 0;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill(); if (ctx.lineWidth) ctx.stroke();
  if (texto) {
    ctx.fillStyle = colorTexto; ctx.font = `700 ${caso === "ejemplo" ? 20 : 13}px Segoe UI, Arial`;
    ctx.textAlign = caso === "ejemplo" ? "center" : "left"; ctx.textBaseline = "middle";
    if (caso === "ejemplo") ctx.fillText(texto, x, y + 1); else ctx.fillText(texto, x + r + 3, y - r - 3);
  }
  ctx.restore();
}

function anillo(v, color, avance) {
  const [x, y] = P(v);
  ctx.save(); ctx.strokeStyle = color; ctx.globalAlpha = 1 - avance; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, radio + 6 + avance * (caso === "ejemplo" ? 30 : 26), 0, 2 * Math.PI); ctx.stroke();
  ctx.restore();
}

function fondo() {
  ctx.clearRect(0, 0, lienzo.width, lienzo.height);
  for (const i in D.arcos) if (!D.arcos[i].zona) linea(i, "#26375f", 1.5);
}

function base(colorArco, alfa) {
  ctx.globalAlpha = alfa;
  D.requeridos.forEach(i => linea(i, colorArco, grosor, { flecha: true }));
  ctx.globalAlpha = 1;
}

function vertices(modo) {
  for (const v of D.zonaV) {
    const b = D.vertices[v].bal;
    if (modo === "balance" && b !== 0) {
      const c = b > 0 ? "#e07b39" : "#f2c14e";
      vertice(v, c, caso === "ejemplo" ? radio : 8, (b > 0 ? "+" : "−") + Math.abs(b), c);
    } else if (caso === "ejemplo") {
      vertice(v, modo === "balance" ? "#5fe39a" : "#00d9ff", radio, D.vertices[v].nombre);
    } else {
      vertice(v, "#00d9ff", radio);
    }
  }
}

function marcaInicio() {
  if (caso !== "barrio") return;
  const [x, y] = P(D.inicio);
  ctx.save(); ctx.fillStyle = "#fff"; ctx.shadowColor = "#fff"; ctx.shadowBlur = 12; ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 5 : 11;
    ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a));
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.font = "700 14px Segoe UI, Arial"; ctx.fillText("UAI", x + 14, y + 18);
  ctx.restore();
}

function camion(x, y, ang) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  const s = caso === "ejemplo" ? 1.6 : 1.4;
  ctx.shadowColor = "#e07b39"; ctx.shadowBlur = 16;
  ctx.fillStyle = "#e07b39"; ctx.fillRect(-12 * s, -7 * s, 16 * s, 14 * s);   // caja
  ctx.fillStyle = "#ffffff"; ctx.fillRect(4 * s, -6 * s, 8 * s, 12 * s);      // cabina
  ctx.fillStyle = "#0e1733"; ctx.fillRect(9 * s, -4.5 * s, 2.5 * s, 9 * s);   // parabrisas
  ctx.restore();
}

// ------------------------------------------------------------------ panel lateral
function panel() {
  document.getElementById("fases").innerHTML = FASES.map((f, k) =>
    `<div class="fase ${k === fase ? "actual" : k < fase ? "hecha" : ""}" data-k="${k}"><b>${k + 1}</b>${f}</div>`).join("");
  document.querySelectorAll(".fase").forEach(el => el.onclick = () => irA(+el.dataset.k));
  document.getElementById("titulo-fase").textContent = FASES[fase];
  const nV = D.zonaV.size, nA = D.requeridos.length, u = D.unidad;
  const desb = [...D.zonaV].filter(v => D.vertices[v].bal !== 0).length;
  const txt = document.getElementById("texto-fase"), datos = document.getElementById("datos");
  const dato = (v, e, cl = "") => `<div class="dato ${cl}"><div class="v">${v}</div><div class="e">${e}</div></div>`;
  document.getElementById("lista-pasos").innerHTML = "";
  if (fase === 0) {
    txt.innerHTML = caso === "ejemplo"
      ? "Dos triángulos que comparten el vértice C. Cada arco tiene un sentido: es un dígrafo."
      : "Calles reales alrededor de la sede de Lomas de Zamora, bajadas de OpenStreetMap. Cada esquina es un vértice y cada cuadra un arco, en el sentido de circulación. Las calles doble mano tienen un arco por cada lado.";
    datos.innerHTML = dato(nV, "vértices") + dato(nA, caso === "ejemplo" ? "arcos" : "cuadras a recolectar") +
      (caso === "barrio" ? dato(fmtKm(suma(D.requeridos)), "largo de las cuadras", "cian") + dato("500 m", "lado de la zona") : "");
  } else if (fase === 1) {
    txt.innerHTML = "En cada vértice se calcula g<sub>s</sub>(v) − g<sub>e</sub>(v). Para que exista un circuito euleriano tienen que dar todos 0." +
      (desb ? `<span class="conclusion">${desb} vértices desbalanceados: no hay circuito euleriano.</span>`
            : `<span class="conclusion" style="color:#5fe39a">Todos balanceados: hay circuito euleriano.</span>`);
    datos.innerHTML = dato(nV - desb, "balanceados", "cian") + dato(desb, "desbalanceados", "naranja");
  } else if (fase === 2) {
    txt.innerHTML = D.extra.length
      ? "Para balancear, el camión tiene que pasar de más por algunas cuadras. El programa elige las que suman menos metros (problema del cartero chino)."
      : "No hace falta repetir ningún arco: el dígrafo ya está balanceado.";
    datos.innerHTML = dato(D.extra.length, "pasadas extra", "naranja") +
      (caso === "barrio" ? dato(fmtKm(suma(D.extra)), "de recorrido extra", "naranja") : "");
  } else if (fase === 3) {
    txt.innerHTML = "Se arma un circuito desde el inicio. Mientras queden arcos sin usar, se busca un vértice del circuito que tenga arcos libres, se arma otro circuito desde ahí y se empalma.";
    datos.innerHTML = dato(D.pasos.length - 1, "subcircuitos empalmados", "cian") + dato(D.totalPasos, u + " en total");
    document.getElementById("lista-pasos").innerHTML = D.pasos.map((p, k) =>
      `<div style="border-color:${COLORES_PASO[k % COLORES_PASO.length]}">` +
      (k === 0 ? `Circuito inicial: ${p.arcos.length} ${u}` :
                 `Subcircuito ${k}: ${p.arcos.length} ${u} · empalme en ${D.vertices[p.en].nombre}`) + `</div>`).join("");
  } else {
    txt.innerHTML = "El recorrido final: pasa por todos los arcos y vuelve al punto de partida." +
      (caso === "barrio" ? " En naranja punteado, las pasadas en las que el camión solo circula." : "");
    datos.innerHTML = `<div class="dato"><div class="v" id="d-n">0</div><div class="e">${u} recorridas de ${D.ruta.length}</div></div>` +
      (caso === "barrio"
        ? `<div class="dato cian"><div class="v" id="d-j">0</div><div class="e">recolectando</div></div>` +
          `<div class="dato naranja"><div class="v" id="d-x">0</div><div class="e">pasadas extra</div></div>` +
          `<div class="dato"><div class="v" id="d-t">0</div><div class="e">recorrido total</div></div>` : "");
  }
}

// ------------------------------------------------------------------ fases
function irA(k) {
  fase = Math.max(0, Math.min(FASES.length - 1, k)); t = 0; pausa = false;
  document.getElementById("btn-pausa").textContent = "Pausa";
  document.getElementById("leyenda-calle").innerHTML = "";
  panel();
}

function cuadro(dt) {
  if (!pausa) t += dt * +document.getElementById("vel").value;
  fondo();
  const leyenda = document.getElementById("leyenda-calle");
  if (fase === 0) {
    const n = Math.min(D.requeridos.length, Math.floor(t * D.velocidad * 3) + 1);
    D.requeridos.slice(0, n).forEach(i => linea(i, "#7fcadd", grosor, { flecha: true }));
    vertices("normal"); marcaInicio();
  } else if (fase === 1) {
    base("#7fcadd", 0.55); vertices("balance"); marcaInicio();
  } else if (fase === 2) {
    base("#7fcadd", 0.35);
    const n = Math.min(D.extra.length, Math.floor(t * D.velocidad * 2));
    D.extra.slice(0, n).forEach(i => linea(i, "#e07b39", grosor, { punteada: true, corr: grosor * 2.2, flecha: true, brillo: 10 }));
    vertices("balance"); marcaInicio();
  } else if (fase === 3) {
    base("#3b5a8a", 0.7);
    D.extra.forEach(i => linea(i, "#3b5a8a", grosor, { punteada: true, corr: grosor * 2.2 }));
    const hechos = t * D.velocidad;
    let actual = 0;
    D.pasos.forEach((p, k) => {
      const ini = D.inicioPaso[k] + k * 1.5;            // una pausa corta antes de cada subcircuito
      const col = COLORES_PASO[k % COLORES_PASO.length];
      const n = hechos - ini;
      if (n <= -1.5) return;
      actual = k;
      if (k > 0 && n < 1.5) anillo(p.en, col, ((n + 1.5) / 3) % 1);
      p.arcos.forEach((i, j) => {
        const f = Math.max(0, Math.min(1, n - j));
        if (f > 0) linea(i, col, grosor + 0.5, { hasta: f, flecha: true, brillo: 6 });
      });
      if (k > 0) {
        const [x, y] = P(p.en);
        ctx.save(); ctx.fillStyle = col; ctx.font = "700 14px Segoe UI, Arial";
        ctx.fillText("empalme", x + 12, y + (caso === "ejemplo" ? 44 : 22)); ctx.restore();
      }
    });
    vertices("normal"); marcaInicio();
    document.querySelectorAll("#lista-pasos div").forEach((el, k) => el.classList.toggle("actual", k === actual));
    leyenda.innerHTML = `<small>${actual === 0 ? "Circuito inicial desde" : "Empalme en"}</small>${D.vertices[D.pasos[actual].en].nombre}`;
  } else {
    base("#2c416c", 1);
    const pos = Math.min(D.ruta.length, t * D.velocidad * 0.9);
    const n = Math.floor(pos), f = pos - n;
    for (let k = 0; k < Math.min(n + 1, D.ruta.length); k++) {
      const col = D.recolecta[k] ? `hsl(${190 + 110 * k / D.ruta.length}, 95%, 60%)` : "#e07b39";
      linea(D.ruta[k], col, grosor + 0.5, { hasta: k < n ? 1 : f, punteada: !D.recolecta[k], corr: D.recolecta[k] ? undefined : grosor * 2.2 });
    }
    vertices("normal"); marcaInicio();
    const k = Math.min(n, D.ruta.length - 1), ff = n >= D.ruta.length ? 1 : f;
    const [x1, y1, x2, y2] = puntos(D.ruta[k], D.recolecta[k] ? undefined : grosor * 2.2);
    camion(x1 + (x2 - x1) * ff, y1 + (y2 - y1) * ff, Math.atan2(y2 - y1, x2 - x1));
    const a0 = Math.floor(pos), a1 = Math.ceil(pos), r = pos - a0;
    const m = D.acum[a0] + r * (D.acum[a1] - D.acum[a0]);
    const j = D.acumJ[a0] + r * (D.acumJ[a1] - D.acumJ[a0]);
    const el = id => document.getElementById(id);
    el("d-n").textContent = Math.floor(pos);
    if (caso === "barrio") { el("d-j").textContent = fmtKm(j); el("d-x").textContent = fmtKm(m - j); el("d-t").textContent = fmtKm(m); }
    if (pos >= D.ruta.length) {
      leyenda.innerHTML = `<small>Terminado</small>Volvió al inicio pasando por todos los arcos`;
    } else {
      const a = D.arcos[D.ruta[k]];
      leyenda.innerHTML = `<small>${D.recolecta[k] ? (caso === "barrio" ? "Recolectando en" : "Recorriendo") : "Solo circula por"}</small>${a.calle}`;
    }
  }
}

function bucle(ahora) {
  const dt = Math.min(0.1, (ahora - ultimo) / 1000); ultimo = ahora;
  cuadro(dt);
  requestAnimationFrame(bucle);
}

// ------------------------------------------------------------------ controles
document.querySelectorAll(".tab").forEach(b => b.onclick = () => cargar(b.dataset.caso));
document.getElementById("btn-sig").onclick = () => irA(fase + 1);
document.getElementById("btn-ant").onclick = () => irA(fase - 1);
document.getElementById("btn-pausa").onclick = () => {
  pausa = !pausa; document.getElementById("btn-pausa").textContent = pausa ? "Seguir" : "Pausa";
};
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", "ArrowDown", "Enter"].includes(e.key)) { irA(fase + 1); e.preventDefault(); }
  else if (["ArrowLeft", "PageUp", "ArrowUp", "Backspace"].includes(e.key)) { irA(fase - 1); e.preventDefault(); }
  else if (e.key === " ") { document.getElementById("btn-pausa").click(); e.preventDefault(); }
  else if (e.key === "r" || e.key === "R") irA(fase);
  else if (e.key === "1") cargar("ejemplo");
  else if (e.key === "2") cargar("barrio");
});
window.addEventListener("resize", ajustar);

cargar("ejemplo");
requestAnimationFrame(bucle);
</script>
</body>
</html>
